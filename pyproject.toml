# Tool configuration only. The kit ships as a skill folder, not as a Python package.

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["skills/reverse-engineering-kit/scripts", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools", "skills/reverse-engineering-kit/scripts"]
